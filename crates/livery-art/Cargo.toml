[package]
name = "pitwall-livery-art"
description = "UI-free livery art: pack images and the fallback car as RGBA pixels, and team colours."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pitwall-core = { path = "../core" }
# Path-only SVG rendering: no text or embedded raster-image features.
resvg = { version = "0.45", default-features = false }
png = "0.17"

[dev-dependencies]
serde_json = "1"
