[package]
name = "pitwall-native"
description = "Native pitwall dashboard: a gpui window over the in-process core."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pitwall-native"
path = "src/main.rs"

[dependencies]
pitwall-core = { path = "../core" }
pitwall-livery-art = { path = "../livery-art" }
# Only to hand decoded livery pixels to gpui, which takes `image` frames; the version gpui uses.
image = { version = "0.25", default-features = false }
serde_json = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9" }
