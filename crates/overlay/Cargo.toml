[package]
name = "pitwall-overlay"
description = "Native in-game throttle/brake overlay: a framework-free Win32 window drawn with Direct2D."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pitwall-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The same windows crate version gpui uses, so the native app links one copy.
[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "pitwall-overlay-replay"
path = "src/bin/replay.rs"
