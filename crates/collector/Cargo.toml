[package]
name = "pitwall-collector"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
dirs = "7.0.0"
if-addrs = "0.15"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
include_dir = "0.7.4"
mime_guess = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pitwall"
path = "src/main.rs"

[[bin]]
name = "pitrec"
path = "../../tools/pitrec/main.rs"

[[bin]]
name = "pitrec-resend"
path = "../../tools/resend/main.rs"
