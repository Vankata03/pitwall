[package]
name = "pitwall-collector"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
dirs = "7.0.0"
if-addrs = "0.15"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
include_dir = "0.7.4"
mime_guess = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pitwall"
path = "src/main.rs"

[[bin]]
name = "pitrec"
path = "../../tools/pitrec/main.rs"
