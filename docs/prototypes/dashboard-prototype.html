<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pitwall dashboard prototype</title>
<!-- Throwaway prototype: three dashboard structures, switched with ?variant=A|B|C. No telemetry, persistence or production application. -->
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#e4e8eb);font:13px var(--font-sans,system-ui)}button,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}header strong{font-size:23px;letter-spacing:-1px}.muted,small{color:var(--muted-foreground,#929ba7)}small{font-size:10px;text-transform:uppercase;letter-spacing:1.1px}.badge{font-size:10px;color:var(--warning,#f4b452);border:1px solid var(--border,#38404b);padding:5px 7px;border-radius:4px}.session{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--border,#38404b);margin-bottom:10px;font:11px var(--font-mono,monospace)}.grid{display:grid;gap:8px}.tile{background:var(--card,#191e26);border:1px solid var(--border,#38404b);border-radius:var(--radius,8px);padding:13px;min-width:0}.tile h2{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500;color:var(--muted-foreground,#929ba7);margin:0 0 12px}.num{font:32px var(--font-mono,monospace);letter-spacing:-1.5px}.unit{font-size:10px;color:var(--muted-foreground,#929ba7);letter-spacing:0}.accent{color:var(--warning,#f4b452)}.green{color:var(--success,#6fdaa3)}.red{color:var(--destructive,#ef7979)}.metrics{display:flex;justify-content:space-between;gap:8px}.metrics b{display:block;font:19px var(--font-mono,monospace);margin-top:6px}.gauge{width:120px;height:76px;margin:auto;position:relative;text-align:center}.gauge svg{position:absolute;inset:0;width:100%;height:100%}.gauge .num{position:relative;padding-top:26px;font-size:29px}.gauge .unit{display:block}.bar{height:5px;background:var(--secondary,#303845);margin-top:10px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--warning,#f4b452)}.focus{min-height:260px}.car-wrap{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:5px}.tyre{font:12px var(--font-mono,monospace);line-height:2}.tyre small{font:9px var(--font-sans,system-ui)}.tyre.right{text-align:right}.car{height:200px;width:100%;color:var(--warning,#f4b452)}.car text{font:9px system-ui;fill:var(--foreground,#e4e8eb)}.map svg{width:100%;height:110px}.trace svg{width:100%;height:90px}table{border-collapse:collapse;width:100%;font:11px var(--font-mono,monospace)}td,th{text-align:left;border-bottom:1px solid var(--border,#38404b);padding:9px 3px}th{font-size:9px;font-weight:400;color:var(--muted-foreground,#929ba7)}td:last-child,th:last-child{text-align:right}tr.focus-row{background:var(--secondary,#303845)}.compound{color:var(--warning,#f4b452)}.feed p{font-size:11px;line-height:1.5;margin:8px 0}.classic{grid-template-columns:repeat(4,1fr)}.classic .focus{grid-column:2/4;grid-row:1/3}.classic .tower{grid-column:1/3}.classic .trace{grid-column:3/5}.classic .strategy{grid-column:1/4}.driver{grid-template-columns:3fr 2fr}.driver .drive{grid-column:1/3;display:flex;align-items:center;justify-content:space-around;padding:24px 12px}.driver .drive .num{font-size:64px}.driver .drive .gear{font-size:88px}.driver .focus{grid-row:2/4}.driver .tower{grid-column:1/3}.driver .strategy{grid-column:1/3}.engineer{grid-template-columns:3fr 2fr}.engineer .tower{grid-row:1/4}.engineer .trace,.engineer .strategy{grid-column:1/3}.engineer .focus{min-height:230px}.engineer .car{height:160px}.engineer td{padding:14px 3px}.engineer .drive{display:flex;justify-content:space-between}.switcher{position:sticky;bottom:12px;margin:22px auto 12px;width:max-content;max-width:100%;display:flex;align-items:center;gap:14px;background:var(--popover,#303845);border:1px solid var(--ring,#8b97a8);border-radius:30px;padding:8px 12px;box-shadow:0 4px 20px #0006}.switcher button{background:transparent;color:inherit;border:0;font-size:21px;padding:0 8px}.rationale{font-size:12px;line-height:1.6;margin:12px 0}.status{font:10px var(--font-mono,monospace);color:var(--muted-foreground,#929ba7)}select{color:inherit;background:var(--card,#191e26);border:1px solid var(--border,#38404b);border-radius:4px;padding:5px;max-width:150px}.unavailable{color:var(--muted-foreground,#929ba7);font:12px var(--font-mono,monospace)}@media(max-width:540px){.classic{grid-template-columns:1fr 1fr}.classic .focus{grid-column:1/3;grid-row:2}.classic .tower,.classic .trace,.classic .strategy{grid-column:1/3}.driver,.engineer{grid-template-columns:1fr}.driver .drive,.driver .tower,.driver .strategy,.engineer .trace,.engineer .strategy{grid-column:auto}.driver .focus,.engineer .tower{grid-row:auto}.driver .drive .num{font-size:42px}.driver .drive .gear{font-size:58px}.session{gap:9px;font-size:9px}header strong{font-size:20px}.badge{font-size:8px}}
</style></head><body>
<header><strong>pitwall<span class="accent">.</span></strong><span class="badge">PROTOTYPE · SIMULATED DATA</span><select id="focus" aria-label="Focus car"><option value="player">Focus: player car</option><option value="rival">Focus: rival · restricted</option></select></header>
<div class="session"><span>MONZA / RACE</span><span>LAP <b>18 / 53</b></span><span>P<b>4</b></span><span>TRACK 34°C</span><span>DRY</span></div>
<div id="dashboard" class="grid"></div><p id="rationale" class="rationale"></p><div id="status" class="status"></div>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants=['A','B','C'];let current=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(current))current='A';
const tile=(cls,title,body)=>`<section class="tile ${cls}"><h2>${title}</h2>${body}</section>`;
const gauge=(value,unit,pct)=>`<div class="gauge"><svg viewBox="0 0 120 76"><path d="M12 65 A48 48 0 1 1 108 65" fill="none" stroke="var(--secondary,#303845)" stroke-width="7"/><path d="M12 65 A48 48 0 1 1 108 65" fill="none" stroke="var(--warning,#f4b452)" stroke-width="7" pathLength="100" stroke-dasharray="${pct} 100"/></svg><div class="num">${value}<span class="unit">${unit}</span></div></div>`;
function render(){const restricted=document.querySelector('#focus').value==='rival';
const car=`<svg class="car" viewBox="0 0 140 240" role="img" aria-label="Generic top-down car placeholder, no real livery"><g fill="var(--secondary,#303845)" stroke="var(--muted-foreground,#929ba7)"><rect x="18" y="45" width="22" height="43" rx="5"/><rect x="100" y="45" width="22" height="43" rx="5"/><rect x="15" y="160" width="25" height="49" rx="5"/><rect x="100" y="160" width="25" height="49" rx="5"/></g><g fill="currentColor"><path d="M64 20 L76 20 L80 94 L96 139 L91 190 L49 190 L44 139 L60 94Z"/><rect x="36" y="24" width="68" height="10" rx="2"/><rect x="37" y="207" width="66" height="12" rx="2"/></g><ellipse cx="70" cy="127" rx="11" ry="20" fill="var(--card,#191e26)"/><path d="M40 65H100M40 180H100" stroke="var(--muted-foreground,#929ba7)" stroke-width="3"/><text x="70" y="235" text-anchor="middle">PLACEHOLDER ART</text></svg>`;
const tyre=(side,top,bottom)=>`<div class="tyre ${side}"><small>${side==='right'?'FR':'FL'} · SURFACE</small><div>${restricted?'—':top+'°C'}</div><small>BRAKE</small><div>${restricted?'—':'540°C'}</div><br><small>${side==='right'?'RR':'RL'} · SURFACE</small><div>${restricted?'—':bottom+'°C'}</div><small>WEAR</small><div>${restricted?'—':'18%'}</div></div>`;
const focus=tile('focus','Focus car · '+(restricted?'rival / restricted':'player car / medium tyres'),`<div class="car-wrap">${tyre('',92,95)}${car}${tyre('right',94,97)}</div>${restricted?'<div class="unavailable">Status unavailable · restricted telemetry</div>':'<div class="metrics"><small>Damage <b class="green">0%</b></small><small>Pressure <b>23.5 psi</b></small><small>Tyre age <b>9 laps</b></small></div>'}`);
const tower=tile('tower','Timing tower',`<table><thead><tr><th>POS</th><th>CAR</th><th>LEADER</th><th>TYRE</th><th>AGE</th></tr></thead><tbody>${['NOR','LEC','VER','YOU','PIA','RUS','HAM','ALO'].map((n,i)=>`<tr class="${i===(restricted?4:3)?'focus-row':''}"><td>${i+1}</td><td>${n}</td><td>${['LEADER','+1.481','+3.026','+5.318','+6.091','+9.204','+12.500','+16.329'][i]}</td><td class="compound">${i===3?'M':i%3===0?'H':'M'}</td><td>${i+6}</td></tr>`).join('')}</tbody></table>`);
const map=tile('map','Track map · schematic',`<svg viewBox="0 0 250 120" role="img" aria-label="Schematic track with focus car marker"><path d="M22 98 L99 22 Q107 15 114 24 L124 38 L151 18 Q165 12 177 27 L220 85 Q226 103 201 103 L165 83 L142 93 L119 79 L55 106Z" fill="none" stroke="var(--muted-foreground,#929ba7)" stroke-width="5" stroke-linejoin="round"/><circle cx="80" cy="41" r="6" fill="var(--warning,#f4b452)"/><circle cx="174" cy="24" r="4" fill="var(--info,#8baaff)"/><circle cx="202" cy="102" r="4" fill="var(--info,#8baaff)"/></svg>`);
const trace=tile('trace','Pedal traces · current lap / distance',`<div class="metrics"><small class="green">Throttle</small><small class="red">Brake</small><small>0 – 5.79 km</small></div><svg viewBox="0 0 550 90" preserveAspectRatio="none" role="img" aria-label="Simulated throttle and brake traces by distance"><path d="M0 20H550M0 70H550" stroke="var(--border,#38404b)"/><polyline points="0,12 65,12 70,75 88,75 100,30 125,12 195,12 200,75 220,75 238,12 310,12 320,75 345,75 370,12 420,12 435,75 460,75 485,12 550,12" fill="none" stroke="var(--success,#6fdaa3)" stroke-width="2"/><polyline points="0,78 65,78 70,20 82,20 88,78 195,78 200,15 213,15 220,78 310,78 320,30 338,30 345,78 420,78 435,18 450,18 460,78 550,78" fill="none" stroke="var(--destructive,#ef7979)" stroke-width="2"/></svg>`);
const strategy=tile('strategy','Stint / strategy · display only',`<div class="metrics"><div><small>Current stint</small><b>M · LAP 9</b></div><div><small>Game pit window</small><b>${restricted?'Unavailable':'L22 – 27'}</b></div><div><small>Fuel delta</small><b class="green">${restricted?'Unavailable':'+1.2 laps'}</b></div></div><div class="bar"><i style="width:34%"></i></div>`);
const lap=tile('lap','Lap timing',`<div class="num">1:24.381</div><p class="green">−0.184 <small>vs personal best</small></p><div class="metrics"><small>S1 <b>27.102</b></small><small>S2 <b>28.491</b></small><small>S3 <b>28.788</b></small></div>`);
const ers=tile('ers','ERS / engine',`<div class="metrics"><div><small>Energy</small><b>${restricted?'—':'64%'}</b></div><div><small>Engine</small><b>${restricted?'—':'108°C'}</b></div></div><div class="bar"><i style="width:${restricted?0:64}%"></i></div>`);
const feed=tile('feed','Race control',`<p><span class="green">GREEN</span> · Track clear</p><p class="muted">L17 · Car 11 · Track limits warning</p><p>DRS enabled · Zone 2</p>`);
const drive=tile('drive','Speed / gear / RPM',`<div><div class="num">286<span class="unit"> km/h</span></div><small>Speed</small></div><div><div class="num gear accent">7</div><small>Gear</small></div><div><div class="num">11,240</div><small>RPM</small></div>`);
const definitions={A:{name:'Pitwall Classic',cls:'classic',text:'Dense instrument grid. The focus car anchors the centre; compact gauges surround it. Best for a broad overview.',tiles:[tile('speed','Speed',gauge(286,'km/h',84)),focus,tile('rpm','RPM / gear',gauge('7','11,240 RPM',76)),ers,map,tower,trace,strategy,feed]},B:{name:'Driver glance',cls:'driver',text:'Large speed and gear first. Focus-car condition and lap delta dominate; timing moves below the immediate driving data.',tiles:[drive,focus,lap,ers,trace,map,tower,strategy]},C:{name:'Race engineer',cls:'engineer',text:'Timing leads. Race order, gaps and tyre age stay visible beside car condition; traces and strategy span the lower workspace.',tiles:[tower,focus,ers,map,drive,trace,strategy,feed]}};
const d=definitions[current];document.querySelector('#dashboard').className='grid '+d.cls;document.querySelector('#dashboard').innerHTML=d.tiles.join('');document.querySelector('#variant').textContent=current+' · '+d.name;document.querySelector('#rationale').textContent=d.text;document.querySelector('#status').textContent='STATE · variant='+current+' · focus='+(restricted?'rival':'player')+' · source=simulated · edit mode=off · storage=none';}
function change(delta){current=variants[(variants.indexOf(current)+delta+3)%3];const u=new URL(location.href);u.searchParams.set('variant',current);try{history.replaceState(null,'',u)}catch{}render()}
document.querySelector('#prev').onclick=()=>change(-1);document.querySelector('#next').onclick=()=>change(1);document.querySelector('#focus').onchange=render;document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change(e.key==='ArrowRight'?1:-1)}});render();
</script></body></html>
