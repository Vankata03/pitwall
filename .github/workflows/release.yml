name: Portable release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      PITWALL_BUILD_ID: ${{ github.sha }}
      CARGO_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ env.CARGO_TARGET }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo test --workspace --locked --target ${{ env.CARGO_TARGET }}
      - run: cargo build --release --locked --target ${{ env.CARGO_TARGET }} --bin pitwall
      - name: Stage portable files
        shell: bash
        run: |
          mkdir package
          cp target/${{ env.CARGO_TARGET }}/release/pitwall.exe package/
          cp README.md THIRD-PARTY-NOTICES.md RELEASE-NOTES.md package/
          printf '%s\n' "$PITWALL_BUILD_ID" > package/BUILD-ID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pitwall-${{ env.CARGO_TARGET }}
          path: package/
          if-no-files-found: error
